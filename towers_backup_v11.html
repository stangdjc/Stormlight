<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Towers — A Rosharan Card Game</title>
<style>
:root{--bg:#1a1520;--bg2:#2a2235;--bg3:#3a3245;--bgl:#252030;--brd:#4a4255;--brd2:#5a5265;--txt:#e8e0f0;--dim:#a098b0;--wht:#fff;--blu:#4a9eff;--gld:#ffd700;--red:#ff5555;--grn:#55cc77;--sp:#7cb3ff;--ar:#ff9944;--cv:#ff5577;--sh:#ccaaff;--spb:#1a2a3a;--arb:#2a1a10;--cvb:#2a1020;--shb:#201a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
.page{display:flex;gap:8px;height:100vh;padding:8px}
.game{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
/* Inline Lane Status Bar (above battlefield) */
.lane-status-bar{display:flex;gap:4px;margin:2px 0;justify-content:center}
.ls-chip{padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;border:1px solid var(--brd);text-align:center;flex:1;max-width:140px}
.ls-chip.win{background:rgba(85,204,119,.1);border-color:var(--grn);color:var(--grn)}
.ls-chip.lose{background:rgba(255,85,85,.06);border-color:var(--red);color:var(--red)}
.ls-chip.tied{background:rgba(255,215,0,.06);border-color:var(--gld);color:var(--gld)}
.ls-chip.empty{background:var(--bg3);color:var(--dim)}
/* Formations Bar (below hand) */
.form-bar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:4px 8px;margin-top:3px}
.form-bar .fb-item{font-size:9px;padding:2px 8px;border-radius:4px;background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.12);color:var(--gld)}
.form-bar .fb-item.active{background:rgba(85,204,119,.1);border-color:var(--grn);color:var(--grn);font-weight:700}
/* Floating Wit Chat — moveable left/right */
.wit-float{position:fixed;bottom:12px;width:320px;z-index:50;display:flex;flex-direction:column;transition:all .25s}
.wit-float.pos-right{right:12px}.wit-float.pos-left{left:12px}
.wit-float.mini{width:48px;height:48px;border-radius:50%;cursor:pointer}
.wit-float.mini .wit-body{display:none}
.wit-bubble{width:48px;height:48px;border-radius:50%;background:var(--gld);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);border:2px solid rgba(255,215,0,.4);transition:all .15s}
.wit-bubble:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(255,215,0,.2)}
.wit-float:not(.mini) .wit-bubble{display:none}
/* Smack talk bubble */
.smack{position:relative;display:inline-block}
.smack-bubble{position:absolute;top:-4px;left:100%;margin-left:8px;background:var(--bg3);border:1px solid var(--brd);border-radius:8px 8px 8px 2px;padding:4px 10px;font-size:10px;color:var(--dim);font-style:italic;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;animation:smack-in .3s ease-out;z-index:10;pointer-events:none}
@keyframes smack-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.wit-body{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden;max-height:380px;display:flex;flex-direction:column}
.wit-head-bar{padding:6px 10px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.03)}
.wit-head-bar span{font-size:14px}
.wit-head-bar h4{font-size:11px;color:var(--gld);flex:1;font-weight:700}
.wit-head-bar .wit-close{cursor:pointer;color:var(--dim);font-size:14px;padding:2px 4px}
.wit-head-bar .wit-close:hover{color:var(--txt)}
/* Wit mode toggle */
.wit-mode{padding:4px 8px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:4px}
.wit-mode label{font-size:9px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:2px}
.wit-mode input[type=radio]{appearance:none;width:10px;height:10px;border:2px solid var(--brd);border-radius:50%;cursor:pointer}
.wit-mode input[type=radio]:checked{border-color:var(--gld);background:var(--gld)}
.wit-mode .mode-label{font-size:8px;color:var(--dim);font-weight:600;margin-right:2px}
/* Wit topic dropdown */
.wit-topic{padding:4px 8px;border-bottom:1px solid var(--brd)}
.wit-topic select{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:5px;padding:4px 8px;color:var(--txt);font-size:10px;outline:none;cursor:pointer}
.wit-topic select:focus{border-color:var(--gld)}
/* Messages */
.wit-msgs{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px;max-height:180px}
.wit-msg{padding:5px 8px;border-radius:7px;font-size:10px;line-height:1.4;max-width:92%}
.wit-msg.wit{background:rgba(255,215,0,.05);border:1px solid rgba(255,215,0,.08);color:var(--txt);align-self:flex-start}
.wit-msg.usr{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.1);color:var(--blu);align-self:flex-end;text-align:right}
.wit-msg .wit-nm{font-size:7px;font-weight:700;color:var(--gld);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px;display:block}
.wit-msg.usr .wit-nm{color:var(--blu)}
/* Wit input */
.wit-in{padding:5px;border-top:1px solid var(--brd);display:flex;gap:4px}
.wit-in input{flex:1;background:var(--bg3);border:1px solid var(--brd);border-radius:5px;padding:4px 8px;color:var(--txt);font-size:10px;outline:none}
.wit-in input:focus{border-color:var(--gld)}
.wit-in input::placeholder{color:var(--dim)}
.wit-in button{background:var(--gld);color:var(--bg);border:none;border-radius:5px;padding:4px 10px;font-weight:700;font-size:9px;cursor:pointer}
/* Cheat panel */
.cheat-intel{padding:5px 8px;border-bottom:1px solid var(--brd);font-size:9px;background:rgba(255,85,85,.03)}
.cheat-intel .ci-row{display:flex;justify-content:space-between;padding:1px 0}
.cheat-intel .ci-label{color:var(--dim)}.cheat-intel .ci-val{color:var(--gld);font-weight:700}
.cheat-intel .ci-best{background:rgba(85,204,119,.08);padding:3px 5px;border-radius:3px;margin-top:2px;color:var(--grn);font-weight:600;font-size:9px}
/* Legacy advisor classes (kept for advHTML compatibility) */
.adv-sec{margin-bottom:6px}
.adv-sec h4{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:3px}
.tip{border-radius:5px;padding:5px 7px;margin-bottom:4px;font-size:10px;line-height:1.3;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.03)}
.tip.w{background:rgba(255,85,85,.05);border-color:rgba(255,85,85,.12)}
.tip.i{background:rgba(74,158,255,.05);border-color:rgba(74,158,255,.12)}
.tip .tl{font-weight:700;font-size:8px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px;display:block}
.tip.w .tl{color:var(--red)}.tip.i .tl{color:var(--blu)}.tl.g{color:var(--gld)}
.la{display:none} /* Hidden — replaced by inline lane-status-bar */
.lc{display:none}
/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;margin-bottom:6px;background:linear-gradient(90deg,var(--bg2),rgba(42,34,53,.9));border-radius:10px;border:1px solid var(--brd);flex-wrap:wrap;gap:4px}
.top h1{font-size:18px;color:var(--gld);letter-spacing:2px;font-weight:800;text-shadow:0 0 12px rgba(255,215,0,.15)}
.top-r{display:flex;align-items:center;gap:8px}
.mi{font-size:12px;color:var(--dim)}.mi b{color:var(--gld);font-weight:600}
.badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:2px 6px;border-radius:3px;background:rgba(204,170,255,.12);color:var(--sh);border:1px solid rgba(204,170,255,.25)}
/* Player labels */
.pl{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;margin:3px 0;font-size:12px;font-weight:600;border-radius:5px}
.pl.ai{background:rgba(255,85,85,.08);color:var(--red)}.pl.hu{background:rgba(74,158,255,.08);color:var(--blu)}
.cc{font-weight:400;color:var(--dim);font-size:11px}
/* Battlefield — Rosharan Shattered Plains */
.bf{display:flex;gap:6px;margin:3px 0;flex:1;min-height:0;position:relative}
.bf::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(74,158,255,.04),transparent 70%);pointer-events:none;border-radius:10px}
.ln{flex:1;border:1px solid var(--brd);border-radius:9px;background:linear-gradient(180deg,rgba(30,25,40,.9),var(--bgl),rgba(30,25,40,.9));overflow:hidden;display:flex;flex-direction:column;position:relative}
.ln::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30 Q15 28 30 30 Q45 32 60 30' fill='none' stroke='%23ffffff' stroke-width='.3' opacity='.03'/%3E%3Cpath d='M0 50 Q20 48 40 50 Q50 52 60 50' fill='none' stroke='%23ffffff' stroke-width='.2' opacity='.02'/%3E%3C/svg%3E");pointer-events:none;border-radius:9px}
.ln.tower-lane{border-color:var(--gld);box-shadow:0 0 12px rgba(255,215,0,.12),inset 0 0 20px rgba(255,215,0,.03)}
.ln.tower-lane .lh{background:linear-gradient(180deg,rgba(255,215,0,.06),transparent)}
.lh{text-align:center;padding:6px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--brd);background:rgba(255,255,255,.02)}
.lh .tower-icon{color:var(--gld);font-size:11px;margin-left:3px;filter:drop-shadow(0 0 3px rgba(255,215,0,.4))}
.ls{flex:1;min-height:60px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.ls.as{border-bottom:1px solid var(--brd)}
.lt{text-align:center;padding:3px 0;font-size:12px;font-weight:700;background:linear-gradient(90deg,rgba(255,85,85,.04),rgba(255,255,255,.02),rgba(74,158,255,.04));border-top:1px solid var(--brd);border-bottom:1px solid var(--brd)}
.lt .at{color:var(--red);text-shadow:0 0 6px rgba(255,85,85,.3)}.lt .vs{color:var(--dim);margin:0 6px}.lt .ht{color:var(--blu);text-shadow:0 0 6px rgba(74,158,255,.3)}
/* Formation badges */
.fm-row{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;padding:2px 4px;min-height:16px}
.fm-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(255,215,0,.1);color:var(--gld);border:1px solid rgba(255,215,0,.2)}
/* Click-to-deploy: lane targets */
.ln.deploy-target{cursor:pointer;border-color:var(--grn);box-shadow:0 0 12px rgba(85,204,119,.15)}
.ln.deploy-target:hover{box-shadow:0 0 20px rgba(85,204,119,.25);border-color:#77ee99}
.ln.deploy-target.blocked{cursor:not-allowed;border-color:var(--red);box-shadow:0 0 8px rgba(255,85,85,.1);opacity:.6}
.ln.deploy-target.blocked:hover{box-shadow:0 0 8px rgba(255,85,85,.1)}
/* Lane preview indicator */
.lane-preview{text-align:center;padding:3px 0;font-size:11px;font-weight:700;min-height:20px;transition:all .2s}
.lane-preview .preview-add{color:var(--grn);font-weight:800}
.lane-preview .preview-form{color:var(--gld);font-size:9px;display:block}
.lane-preview .preview-blocked{color:var(--red);font-size:9px}
/* Pulsing action hints */
@keyframes pulse-gold{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}50%{box-shadow:0 0 12px 3px rgba(255,215,0,.25)}}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(255,85,85,0)}50%{box-shadow:0 0 10px 2px rgba(255,85,85,.2)}}
.btn.pulse-pass{animation:pulse-gold 1.8s ease-in-out infinite;border-color:var(--gld);color:var(--gld)}
.btn.pulse-concede{animation:pulse-red 2s ease-in-out infinite}
/* Wit cheat mode toggle */
.wit-mode{padding:6px 8px;border-top:1px solid var(--brd);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wit-mode label{font-size:9px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:3px}
.wit-mode input[type=radio]{appearance:none;width:12px;height:12px;border:2px solid var(--brd);border-radius:50%;cursor:pointer;transition:all .15s}
.wit-mode input[type=radio]:checked{border-color:var(--gld);background:var(--gld)}
.wit-mode .mode-label{font-size:9px;color:var(--dim);font-weight:600;margin-right:4px}
/* Cheat panel */
.cheat-intel{padding:6px 8px;border-bottom:1px solid var(--brd);font-size:10px;background:rgba(255,85,85,.03)}
.cheat-intel .ci-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.cheat-intel .ci-label{color:var(--dim)}.cheat-intel .ci-val{color:var(--gld);font-weight:700}
.cheat-intel .ci-best{background:rgba(85,204,119,.08);padding:4px 6px;border-radius:4px;margin-top:4px;color:var(--grn);font-weight:600}
/* Cards — Rosharan Illustrated */
.cd{width:62px;height:86px;border-radius:8px;border:2px solid var(--brd2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:default;transition:all .2s;position:relative;user-select:none;overflow:hidden}
.cd::before{content:'';position:absolute;inset:0;border-radius:6px;opacity:.12;pointer-events:none}
.cd::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='none'/%3E%3Cpath d='M0 0L40 40M40 0L0 40' stroke='%23ffffff' stroke-width='.15' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;border-radius:6px}
.cd .cv{font-size:24px;font-weight:800;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:1}
.cd .ci{z-index:1;margin-bottom:2px}
.cd .ci svg{width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.cd .ct{font-size:7px;text-transform:uppercase;letter-spacing:.8px;margin-top:2px;opacity:.7;font-weight:700;z-index:1}
.cd .cs{position:absolute;top:3px;right:4px;font-size:8px;font-weight:800;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:3px;z-index:1}
.cd .cd-suit{position:absolute;top:3px;left:4px;font-size:9px;opacity:.4;font-weight:700;z-index:1}
.cd .cd-eff{position:absolute;bottom:3px;right:4px;font-size:8px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:3px;color:var(--grn);z-index:1}
.cd .fat-ind{position:absolute;bottom:3px;left:4px;font-size:8px;font-weight:700;color:var(--red);text-shadow:0 0 6px rgba(255,85,85,.6);z-index:1}
/* Spearmen — steel blue, disciplined */
.cd.spearmen{background:linear-gradient(160deg,#1a2d42,#0d1824,#162538);border-color:var(--sp);color:var(--sp)}
.cd.spearmen::before{background:linear-gradient(180deg,rgba(124,179,255,.2),transparent 60%)}
/* Archers — ember orange, ranged */
.cd.archers{background:linear-gradient(160deg,#2e1a0a,#1a0e04,#261508);border-color:var(--ar);color:var(--ar)}
.cd.archers::before{background:linear-gradient(180deg,rgba(255,153,68,.2),transparent 60%)}
/* Cavalry — crimson, mobile */
.cd.cavalry{background:linear-gradient(160deg,#2e0e18,#1a0810,#261016);border-color:var(--cv);color:var(--cv)}
.cd.cavalry::before{background:linear-gradient(180deg,rgba(255,85,119,.2),transparent 60%)}
/* Shardbearers — purple glow, legendary */
.cd.shardbearers{background:linear-gradient(160deg,#1e1430,#120e22,#1a1228);border-color:var(--sh);color:var(--sh);box-shadow:inset 0 0 15px rgba(204,170,255,.1),0 0 6px rgba(204,170,255,.08)}
.cd.shardbearers::before{background:linear-gradient(180deg,rgba(204,170,255,.25),transparent 50%)}
@keyframes shard-pulse{0%,100%{box-shadow:inset 0 0 15px rgba(204,170,255,.1),0 0 6px rgba(204,170,255,.08)}50%{box-shadow:inset 0 0 20px rgba(204,170,255,.15),0 0 10px rgba(204,170,255,.12)}}
.cd.shardbearers{animation:shard-pulse 3s ease-in-out infinite}
/* Face-down */
.cd.face-down{background:linear-gradient(135deg,#2a2535,#1e1a28)!important;border-color:var(--brd2)!important;color:var(--dim)!important;box-shadow:none!important;animation:none!important}
.cd.face-down::before,.cd.face-down::after{display:none}
.cd.face-down .ci,.cd.face-down .cv,.cd.face-down .ct,.cd.face-down .cs,.cd.face-down .cd-suit,.cd.face-down .cd-eff,.cd.face-down .fat-ind{visibility:hidden}
.cd.face-down .ci svg{visibility:hidden}
/* Deploy animation */
@keyframes card-deploy{from{opacity:0;transform:translateY(20px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.ls .cd{animation:card-deploy .25s ease-out}
/* Card back pattern for face-down */
.cd.face-down .card-back{position:absolute;inset:6px;border:1px solid rgba(255,255,255,.08);border-radius:4px;display:flex;align-items:center;justify-content:center}
.cd.face-down .card-back svg{width:20px;height:20px;opacity:.2}
/* Hand */
.ha{margin-top:5px;padding:8px 12px;background:var(--bg2);border-radius:9px;border:1px solid var(--brd)}
.ha-l{font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.hd{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:70px;align-items:center}
.hd .cd{cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1)}
.hd .cd:hover{transform:translateY(-8px) scale(1.06);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:10}
.hd .cd.sel{transform:translateY(-12px) scale(1.08);box-shadow:0 0 0 2px var(--gld),0 0 20px rgba(255,215,0,.25),0 10px 30px rgba(0,0,0,.5)}
.hd .cd.unp{opacity:.25;filter:grayscale(.7) brightness(.7)}
.ls .cd{width:52px;height:72px}.ls .cd .cv{font-size:18px}.ls .cd .ci svg{width:18px;height:18px}.ls .cd .ct{font-size:5px}
/* Retreat/Move highlight */
.ls.rm .cd{cursor:pointer;outline:2px dashed var(--gld);outline-offset:1px}.ls.rm .cd:hover{outline-color:var(--red)}
.ls.mm .cd{cursor:pointer;outline:2px dashed var(--blu);outline-offset:1px}.ls.mm .cd:hover{outline-color:var(--grn)}
/* Actions */
.act{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.btn{padding:6px 16px;border-radius:7px;border:1px solid var(--brd);background:var(--bg3);color:var(--txt);font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.btn:hover:not(:disabled){background:var(--brd)}.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.p{background:var(--blu);color:#fff;border-color:var(--blu)}.btn.p:hover:not(:disabled){background:#3a8aee}
.btn.d{background:rgba(255,85,85,.12);color:var(--red);border-color:var(--red)}.btn.d:hover:not(:disabled){background:rgba(255,85,85,.22)}
.btn.g{background:rgba(255,215,0,.12);color:var(--gld);border-color:var(--gld)}
.btn.sm{padding:4px 10px;font-size:10px}
.lsb{display:flex;gap:6px;justify-content:center;margin-top:4px}.lsb .btn{flex:1;max-width:160px}
.blk{text-align:center;padding:6px 12px;margin:4px 0;font-size:12px;color:var(--red);background:rgba(255,85,85,.06);border:1px solid rgba(255,85,85,.15);border-radius:7px}
/* Status/Log */
.sb2{text-align:center;padding:6px;margin:4px 0;font-size:13px;font-weight:600;color:var(--gld);background:var(--bg2);border-radius:7px;border:1px solid var(--brd);min-height:32px;display:flex;align-items:center;justify-content:center}
.log{margin-top:4px;padding:4px 10px;background:var(--bg2);border-radius:7px;border:1px solid var(--brd);max-height:60px;overflow-y:auto;font-size:11px;color:var(--dim)}
.log p{margin-bottom:2px}.log .ai-msg{color:var(--red)}.log .player-msg{color:var(--blu)}.log .system-msg{color:var(--gld)}
.hint{font-size:10px;color:var(--dim);text-align:center;margin-top:3px;min-height:14px}
/* Overlay */
.ov{position:fixed;inset:0;background:rgba(10,8,15,.92);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.ac{opacity:1;pointer-events:all}
.ovc{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:28px 36px;text-align:center;max-width:460px}
.ovc h2{font-size:22px;color:var(--gld);margin-bottom:6px}.ovc p{color:var(--dim);margin-bottom:10px;font-size:13px}

<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════
// TOWERS v3 — Enhanced Game Engine
// ═══════════════════════════════════════
const UT=['spearmen','archers','cavalry','shardbearers'];
const UI={spearmen:'⚔️',archers:'🏹',cavalry:'🐴',shardbearers:'🗡️'};
const MODES={
  standard:{lanes:3,ln:['Left Flank','Center','Right Flank'],w:2,deal:10,draw:3,fd:false,label:'Standard',ar:1,tower:true,towerIdx:1},
  flatface:{lanes:3,ln:['Left Flank','Center','Right Flank'],w:2,deal:10,draw:3,fd:true,label:'Flatface',ar:1,tower:true,towerIdx:1},
  crosswise:{lanes:5,ln:['Far Left','Left','Center','Right','Far Right'],w:3,deal:13,draw:3,fd:false,label:'Crosswise Chull',ar:2,tower:true,towerIdx:2}
};
const AIW={
  sadeas:{cp:-5,fp:10,fb:3,ca:15,ct:.6,ac:true,name:'Sadeas',icon:'🔴',desc:'Ruthless — flanks first, baits Center',tier:1},
  dalinar:{cp:15,fp:5,fb:12,ca:5,ct:.2,ac:false,name:'Dalinar',icon:'🔵',desc:'Honorable — formations, holds The Tower',tier:1},
  adolin:{cp:8,fp:8,fb:8,ca:8,ct:.4,ac:true,name:'Adolin',icon:'🟡',desc:'Balanced — adapts to your strategy',tier:2},
  taravangian:{cp:5,fp:5,fb:6,ca:20,ct:.8,ac:false,name:'Taravangian',icon:'🟤',desc:'Calculating — sacrifices lanes to win wars',tier:3},
  odium:{cp:12,fp:12,fb:10,ca:10,ct:.15,ac:true,name:'Odium',icon:'🟣',desc:'Overwhelming — relentless pressure everywhere',tier:4}
};

// Smack talk per AI personality
const SMACK={
  sadeas:{
    deploy:["Oh how bold. Did a servant suggest that?","Predictable. I expected more from a Kholin.","Is that your best card? *laughs*","A fine move... for an amateur."],
    pass:["Passing already? How... restrained.","The Blackthorn hesitates. How unlike him.","Conserving? Or simply out of ideas?"],
    winRound:["Another round to me. The Codes won't save you.","I've seen Thaylen merchants negotiate better, and they were drunk!","Perhaps you should stick to bridge runs."],
    loseRound:["A minor setback. Enjoy it while it lasts.","You got lucky. That won't happen again."],
    concede:["Wise. The first smart thing you've done.","At least you know when you're beaten."],
    deploy_strong:["Oh, bringing out the heavy units? Desperate times.","That's... actually concerning. No matter."]
  },
  dalinar:{
    deploy:["A solid deployment. I respect the positioning.","You fight with honor. Good.","The Codes would approve of that formation."],
    pass:["A patient commander. I can respect that.","Wisdom in restraint."],
    winRound:["The round is mine. No dishonor in your effort.","I take no pleasure in this... well, perhaps a little."],
    loseRound:["Well fought. You earned that.","Honor is satisfied. On to the next round."],
    concede:["There is no shame in a strategic retreat.","A wise decision. We'll meet again."],
    deploy_strong:["A powerful move. Let us see if it holds."]
  },
  adolin:{
    deploy:["Not bad! But watch this—","Ooh, going there? Interesting choice.","My father would approve. I'm not sure I do.","You know what? That's actually pretty clever."],
    pass:["Taking a breather? Smart.","Alright, my turn to shine."],
    winRound:["Yes! Did you see that? Did you see what I did there?","Ha! Adolin Kholin takes the round!"],
    loseRound:["Okay okay, you got me. But I'm coming back.","Storms. That was good. I'll admit it."],
    concede:["You're giving up? Really? I was just getting started!"],
    deploy_strong:["Bringing out the Shards? Now it's a real fight!"]
  },
  taravangian:{
    deploy:["...yes. That will do.","Every piece has its purpose. Even the ones we sacrifice.","Interesting. I've already calculated three responses.","The Diagram suggested you'd play that."],
    pass:["Patience. All according to plan.","..."],
    winRound:["The outcome was inevitable. I calculated it turns ago.","Compassion is a weakness at this table."],
    loseRound:["An acceptable loss. It serves the larger design.","You believe you've won? The Diagram accounts for this."],
    concede:["A sacrifice. You wouldn't understand why.","This round was never the objective."],
    deploy_strong:["Hmm. I may need to recalculate."]
  },
  odium:{
    deploy:["PASSION drives me. What drives you?","Your little armies amuse me.","I have broken worlds. Your cards are nothing.","Feel the futility. Embrace it."],
    pass:["Hesitation? I can taste your doubt.","You delay the inevitable."],
    winRound:["KNEEL. This is merely the beginning.","Your defeat was written in the stars.","Did you truly believe you could win?"],
    loseRound:["...Impossible. This changes nothing.","A temporary setback. I am ETERNAL."],
    concede:["Yes. Surrender. It is the natural order.","Wise. Fighting me was always futile."],
    deploy_strong:["Interesting. But even Shardbearers break before me."]
  }
};

let currentSmack='',smackTimer=null;
function triggerSmack(event){
  if(pvpMode)return;
  const lines=SMACK[aiPers]?.[event];
  if(!lines||!lines.length)return;
  currentSmack=lines[Math.floor(Math.random()*lines.length)];
  if(smackTimer)clearTimeout(smackTimer);
  smackTimer=setTimeout(()=>{currentSmack='';R()},4500);
}

// Track which opponents have been beaten
let beatenOpponents=[];

// ═══════════════════════════════════════
// v10: Sound Engine (Web Audio API)
// ═══════════════════════════════════════
let soundOn=true,audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playTone(freq,dur,type='sine',vol=.12,decay=true){
  if(!soundOn)return;try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);g.gain.setValueAtTime(vol,ac.currentTime);
  if(decay)g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function playNoise(dur,vol=.06){
  if(!soundOn)return;try{const ac=getAC(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.8);
  const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);src.connect(g);g.connect(ac.destination);src.start()}catch(e){}}

// Sound effects
function sndDeploy(){playTone(120,.15,'sine',.1);setTimeout(()=>playNoise(.08,.08),30)}
function sndFormation(){playTone(523,.12,'sine',.08);setTimeout(()=>playTone(659,.12,'sine',.07),80);setTimeout(()=>playTone(784,.18,'sine',.06),160)}
function sndBreakthrough(){playTone(262,.2,'sawtooth',.1);setTimeout(()=>playTone(330,.2,'sawtooth',.1),150);setTimeout(()=>playTone(392,.3,'sawtooth',.12),300);setTimeout(()=>playTone(523,.5,'sawtooth',.14),450);setTimeout(()=>playNoise(.3,.06),500)}
function sndRoundWin(){playTone(523,.15,'sine',.08);setTimeout(()=>playTone(659,.15,'sine',.07),120);setTimeout(()=>playTone(784,.25,'sine',.09),240)}
function sndRoundLose(){playTone(392,.2,'sine',.07);setTimeout(()=>playTone(330,.2,'sine',.06),150);setTimeout(()=>playTone(262,.35,'sine',.08),300)}
function sndPass(){playTone(440,.06,'sine',.04)}
function sndConcede(){playTone(330,.15,'sine',.06);setTimeout(()=>playTone(262,.25,'sine',.07),120)}
function sndSelect(){playTone(660,.05,'sine',.04)}

// Ambient highstorm wind — looping noise
let stormNode=null,stormGain=null,stormOn=false;
function toggleStorm(){
  if(!soundOn){stormOn=false;return}
  if(stormOn&&stormNode){try{stormNode.stop()}catch(e){}stormNode=null;stormOn=false;return}
  try{const ac=getAC(),dur=4,buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/ac.sampleRate;d[i]=(Math.random()*2-1)*(0.3+0.2*Math.sin(t*0.7))*0.4}
  stormNode=ac.createBufferSource();stormGain=ac.createGain();stormNode.buffer=buf;stormNode.loop=true;
  stormGain.gain.setValueAtTime(.025,ac.currentTime);stormNode.connect(stormGain);stormGain.connect(ac.destination);
  stormNode.start();stormOn=true}catch(e){stormOn=false}
}
window.toggleSound=function(){soundOn=!soundOn;if(!soundOn&&stormNode){try{stormNode.stop()}catch(e){}stormNode=null;stormOn=false}R()};
window.toggleStorm=toggleStorm;

// ═══════════════════════════════════════
// v10: Breakthrough Particle System
// ═══════════════════════════════════════
function spawnParticles(){
  const container=document.createElement('div');container.className='bt-particles';
  document.body.appendChild(container);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');p.className='bt-particle';
    const cx=window.innerWidth/2,cy=window.innerHeight/2;
    const angle=Math.random()*Math.PI*2,dist=120+Math.random()*280;
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.setProperty('--px',(Math.cos(angle)*dist)+'px');
    p.style.setProperty('--py',(Math.sin(angle)*dist)+'px');
    p.style.width=(4+Math.random()*6)+'px';p.style.height=p.style.width;
    p.style.animationDelay=(Math.random()*.3)+'s';

// Fuzzy topic scorer: returns best-matching topic
function witTopic(ql){
  const topics=[

    {id:'formation',kw:['formation','phalanx','skirmish','shardwall','vanguard','crossfire','combo','synergy','bonus','stack','cluster','group','combine']},
    {id:'tower',kw:['tower','breakthrough','center','middle','dominate center','push center','win center','instant win']},
    {id:'spear',kw:['spear','infantry','spearman','spearmen','foot soldier','pikeman','rank and file','formation bonus','shield wall']},
    {id:'archer',kw:['archer','range','adjacent','bow','support','nearby','long range','ranged']},
    {id:'cavalry',kw:['cavalry','charge','reposition','horse','mount','rider','mobile','flank','rush']},
    {id:'shard',kw:['shard','bearer','shardbearer','double','fatigue','plate','blade','powerful','strongest','decay','degrade','tire']},
    {id:'pass',kw:['pass','when pass','should pass','skip','wait','hold','save','conserve','patience','tempo']},
    {id:'concede',kw:['concede','give up','surrender','resign','yield','forfeit','quit round','lose round','cut losses']},
    {id:'opening',kw:['round 1','first round','early game','opening','start','beginning','initial','first play','first card']},
    {id:'cardadv',kw:['card advantage','more cards','fewer cards','hand size','cards left','card count','card economy','tempo','resource']},
    {id:'opponent',kw:['sadeas','dalinar','opponent','enemy','ai','beat','counter','defeat','win against','strategy against','fight','versus']},
    {id:'rules',kw:['rule','how play','how work','explain','basics','tutorial','learn','teach','new player','beginner','what is']},
    {id:'move',kw:['move','moving','shift','transfer','relocate','adjacent','switch lane']},
    {id:'flatface',kw:['flatface','flat face','hidden','face down','bluff','secret','blind']},
    {id:'crosswise',kw:['crosswise','chull','5 lane','five lane','expanded','wide','bigger']},
    {id:'wit',kw:['who are you','your name','hoid','wit','yourself','name','introduce']},
    {id:'story',kw:['story','tell me','joke','entertain','fun','laugh','amuse','tale','riddle','poem']},
    {id:'lore',kw:['stormlight','radiant','knight','honor','dalinar lore','roshar','cosmere','brandon','sanderson','oath','ideal','bridge']},
    {id:'win',kw:['win','winning','lose','losing','ahead','behind','score','standing','status','situation','how am i doing','am i winning']},
    {id:'deploy',kw:['deploy','play','place','put','where','which lane','best lane','where should','drop']},
    {id:'retreat',kw:['retreat','pull back','take back','remove','withdraw','recall']},
  ];
  let best=null,bestScore=0;
  for(const t of topics){
    let score=0;
    for(const kw of t.kw){
      if(ql.includes(kw))score+=kw.split(' ').length+1; // multi-word matches score higher
    }
    if(score>bestScore){bestScore=score;best=t.id}
  }
  return{topic:best,score:bestScore};
}

// ── Lane Preview Calculator ──
function calcPreview(card,laneIdx,s){
  if(!s||!card)return null;
  const side=pvpMode&&s.turn==='ai'?'ai':'human';
  if(card.type==='shardbearers'&&!canShard(s.lanes[laneIdx],side))return{blocked:true};
  // Simulate deploying this card
  const simLanes=s.lanes.map((l,i)=>({human:[...l.human],ai:[...l.ai]}));
  const simCard={...card,deployTurn:turnNum,moved:false};
  simLanes[laneIdx][side].push(simCard);
  const M=MODES[s.mode];
  const before=calcStr(s.lanes[laneIdx][side],laneIdx,s.lanes,side,s.mode,turnNum);
  const after=calcStr(simLanes[laneIdx][side],laneIdx,simLanes,side,s.mode,turnNum);
  const diff=after-before;
  // Check if new formations trigger
  const formsBefore=detectFormations(s.lanes[laneIdx][side],laneIdx,s.lanes,side,s.mode);
  const formsAfter=detectFormations(simLanes[laneIdx][side],laneIdx,simLanes,side,s.mode);
  const newForms=formsAfter.filter(f=>!formsBefore.some(b=>b.n===f.n));
  // Check adjacent lane archer impact
  let adjBonus=0;
  if(card.type==='archers'){
    for(let d=1;d<=M.ar;d++)for(const o of[-d,d]){const a=laneIdx+o;if(a>=0&&a<M.lanes)adjBonus+=2}
  }
  return{diff,newForms,adjBonus,blocked:false};
}

// ── Cheat Analysis Engine ──
function cheatAnalysis(s){
  if(!s||s.phase!=='play')return null;
  const M=MODES[s.mode],ev=eLanes(s,'human'),hand=s.p.human.h,aiH=s.p.ai.h;
  // AI hand breakdown (cheat: we can see it)
  const aiBreak={spearmen:0,archers:0,cavalry:0,shardbearers:0};
  for(const c of aiH)aiBreak[c.type]++;
  const aiMaxVal=aiH.length>0?Math.max(...aiH.map(c=>c.type==='shardbearers'?c.value*2:c.value)):0;
  // Find optimal play
  let bestPlay=null,bestScore=-Infinity;
  for(const card of hand){
    if(!canPlay(card,s.lanes,'human'))continue;
    for(let li=0;li<M.lanes;li++){
      if(card.type==='shardbearers'&&!canShard(s.lanes[li],'human'))continue;
      const prev=calcPreview(card,li,s);
      if(!prev||prev.blocked)continue;
      // Score: strength gain + formation bonus + lane need
      let score=prev.diff;
      if(prev.newForms.length>0)score+=prev.newForms.reduce((a,f)=>a+f.b,0)+5;
      // Prioritize flipping losing lanes
      if(ev[li].d<0&&ev[li].d+prev.diff>0)score+=15;
      // Tower push
      if(li===M.towerIdx&&ev[li].d+prev.diff>=10)score+=20;
      if(score>bestScore){bestScore=score;bestPlay={card,lane:li,score,diff:prev.diff,forms:prev.newForms}}
    }
  }
  // Should pass?
  const winning=ev.filter(e=>e.d>0).length;
  const shouldPass=winning>=M.w&&ev.filter(e=>e.d>0).every(e=>e.d>=3);
  // Should concede?
  const losing=ev.filter(e=>e.d<0).length;
  const shouldConcede=losing>=M.w&&s.cr<3&&hand.length>3;
  // Win probability per lane
  const laneProbs=ev.map(e=>{
    const margin=e.d;const aiCards=s.lanes[e.i].ai.length;
    if(margin>8)return{pct:95,label:'Dominant'};
    if(margin>4)return{pct:80,label:'Strong'};
    if(margin>0)return{pct:60,label:'Ahead'};
    if(margin===0)return{pct:50,label:'Even'};
    if(margin>-4)return{pct:40,label:'Behind'};
    if(margin>-8)return{pct:20,label:'Weak'};
    return{pct:5,label:'Critical'};
  });
  return{aiBreak,aiMaxVal,bestPlay,shouldPass,shouldConcede,laneProbs,ev,winning,losing};
}

function renderCheatPanel(s){
  const a=cheatAnalysis(s);if(!a)return'';
  const M=MODES[s.mode];
  let h=`<div class="cheat-intel">`;
  h+=`<div class="ci-row"><span class="ci-label">AI Hand</span><span class="ci-val">⚔${a.aiBreak.spearmen} 🏹${a.aiBreak.archers} 🐴${a.aiBreak.cavalry} 🗡${a.aiBreak.shardbearers}</span></div>`;
  h+=`<div class="ci-row"><span class="ci-label">AI Max Card</span><span class="ci-val">${a.aiMaxVal} str</span></div>`;
  h+=`<div class="ci-row"><span class="ci-label">Lane Win %</span><span class="ci-val">${a.laneProbs.map((p,i)=>`${M.ln[i].charAt(0)}:${p.pct}%`).join(' ')}</span></div>`;
  if(a.shouldPass)h+=`<div class="ci-best">PASS — you're winning with margin. Save cards.</div>`;
  else if(a.shouldConcede)h+=`<div class="ci-best" style="color:var(--red)">CONCEDE — save cards for next round.</div>`;
  else if(a.bestPlay){
    const bp=a.bestPlay;

let lastWitState='';
function witProactive(){
  if(witMode==='normal'||!G||G.phase!=='play'||pvpMode)return;
  const a=cheatAnalysis(G);if(!a)return;
  const M=MODES[G.mode];

  // Build a state fingerprint to avoid repeating the same advice
  const stateKey=`${a.winning}-${a.losing}-${G.p.human.h.length}-${a.bestPlay?a.bestPlay.card.id+a.bestPlay.lane:'none'}`;
  if(stateKey===lastWitState)return; // Nothing changed — stay quiet
  lastWitState=stateKey;

  // Only speak on significant events, not every turn
  const lastAiLog=G.log.find(l=>l.t==='ai');
  const significantChange=
    a.shouldPass||a.shouldConcede|| // Clear action needed
    (a.bestPlay&&a.bestPlay.forms.length>0)|| // Formation opportunity
    (G.p.human.h.length<=3)|| // Low on cards
    (a.laneProbs.some(p=>p.pct<=15)); // A lane is critical

  if(!significantChange)return;

  let msg='';
  if(witMode==='enhanced'){
    if(a.shouldPass)msg=`Pass now — you're ahead in ${a.winning} lanes.`;
    else if(a.shouldConcede)msg=`Concede. Save ${G.p.human.h.length} cards for Round ${G.cr+1}.`;
    else if(a.bestPlay&&a.bestPlay.forms.length>0){const bp=a.bestPlay;
      msg=`${UI[bp.card.type]}${bp.card.value} → ${M.ln[bp.lane]} triggers ${bp.forms.map(f=>f.n).join('+')}!`}
    else if(G.p.human.h.length<=3)msg=`${G.p.human.h.length} cards left. Make them count.`;
    else if(a.laneProbs.some(p=>p.pct<=15)){const crit=a.laneProbs.findIndex(p=>p.pct<=15);msg=`${M.ln[crit]} is critical — reinforce or concede it.`}
  } else if(witMode==='cheat'){
    if(a.shouldPass)msg=`PASS. Win%: ${a.laneProbs.map((p,i)=>M.ln[i].charAt(0)+':'+p.pct+'%').join(' ')}`;
    else if(a.shouldConcede)msg=`CONCEDE. Can't win ${M.w} lanes.`;
    else if(a.bestPlay){const bp=a.bestPlay;
      msg=`PLAY: ${UI[bp.card.type]}${bp.card.value}→${M.ln[bp.lane]} (+${bp.diff}${bp.forms.length?', '+bp.forms.map(f=>f.n).join('+'):''})`}
  }
  if(msg)witMsgs.push({from:'wit',text:msg});

  // Cap chat history to prevent scroll bloat
  if(witMsgs.length>30)witMsgs.splice(1,witMsgs.length-20);
}

// AI deck building — personality-weighted card selection
function buildAIDeck(personality){
  const pool=mkDeck();const W=AIW[personality];
  // Weight each card
  const weighted=pool.map(c=>{
    let w=c.value; // base: higher value = more desirable
    if(personality==='sadeas'){
      if(c.type==='cavalry')w+=4;if(c.type==='archers')w+=3;if(c.type==='shardbearers')w+=2;
      if(c.type==='spearmen'&&c.value<5)w-=3; // Sadeas doesn't care for weak infantry
    } else if(personality==='dalinar'){
      if(c.type==='spearmen')w+=5; // Formation builder
      if(c.type==='shardbearers')w+=3;if(c.type==='archers')w+=1;
    } else if(personality==='adolin'){
      w+=2; // Balanced, slight preference for everything
      if(c.type==='cavalry')w+=2;if(c.type==='spearmen')w+=1;
    } else if(personality==='taravangian'){
      w=c.value*1.5; // Pure value maximizer
      if(c.type==='shardbearers')w+=4;
      if(c.value<=3)w-=5; // Hates weak cards
    } else if(personality==='odium'){
      if(c.type==='shardbearers')w+=6;if(c.value>=7)w+=3;
      if(c.type==='spearmen'&&c.value>=5)w+=2;
      w+=2; // Wants everything strong
    }
    // Add randomness so AI decks vary between games
    w+=Math.random()*3;
    return{card:c,weight:w};
  });
  weighted.sort((a,b)=>b.weight-a.weight);
  return weighted.slice(0,20).map(w=>w.card);
}

window.applyPreset=function(key){
  const preset=DECK_PRESETS[key];if(!preset)return;
  const pool=mkDeck();
  const deck=buildingForP2?pvpDeck2:playerDeck;
  deck.length=0;
  if(preset.cards){
    for(const id of preset.cards){const c=pool.find(x=>x.id===id);if(c)deck.push({...c,deployTurn:-1,moved:false})}

    for(const type of UT){
      const tc=pool.filter(c=>c.type===type).sort((a,b)=>b.value-a.value).slice(0,5);

function mkDeck(){const d=[];for(const t of UT)for(let v=1;v<=10;v++)d.push({id:`${t}_${v}`,type:t,value:v,deployTurn:-1,moved:false});return d}
function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

function mkState(m){
  const M=MODES[m],d=shuf(mkDeck()),lanes=[];
  for(let i=0;i<M.lanes;i++)lanes.push({human:[],ai:[]});
  return{mode:m,dp:d.slice(M.deal*2),p:{human:{h:d.slice(0,M.deal),rw:0},ai:{h:d.slice(M.deal,M.deal*2),rw:0}},
    lanes,cr:1,turn:'human',hp:false,ap:false,phase:'play',sel:null,rm:false,mm:false,cm:false,cid:null,log:[],rr:[]}
}

// ── Formations ──
function detectFormations(cards,li,all,pl,m){
  const M=MODES[m],f=[],sp=cards.filter(c=>c.type==='spearmen'),ar=cards.filter(c=>c.type==='archers'),
    cv=cards.filter(c=>c.type==='cavalry'),sh=cards.filter(c=>c.type==='shardbearers');
  if(sp.length>=3)f.push({n:'Phalanx',b:sp.length*3,d:`+${sp.length*3}`,ico:'⚔️'});
  if(ar.length>0&&cv.length>0)f.push({n:'Skirmish',b:ar.length*3+cv.length*2,d:`+${ar.length*3+cv.length*2}`,ico:'🏹🐴'});
  if(sh.length>0&&sp.length>=2)f.push({n:'Shardwall',b:0,nf:true,d:'No fatigue',ico:'🛡️'});
  if(cv.length>0&&cards.length===cv.length)f.push({n:'Vanguard',b:cv.length*4,d:`+${cv.length*4}`,ico:'🐴'});
  let adjAr=0;
  for(let d=1;d<=M.ar;d++)for(const o of[-d,d]){const a=li+o;if(a>=0&&a<M.lanes)adjAr+=all[a][pl].filter(c=>c.type==='archers').length}
  if(ar.length>0&&adjAr>0)f.push({n:'Crossfire',b:ar.length*2,d:`+${ar.length*2}`,ico:'🎯'});
  return f;
}

function calcFatigue(card,curTurn,formations){
  let p=0;
  if(card.moved)p+=1;
  if(card.type==='shardbearers'&&card.deployTurn>=0){
    const t=curTurn-card.deployTurn;
    p+=Math.floor(t/3);
    if(formations.some(f=>f.nf))p=card.moved?1:0;
  }
  return p;
}

function calcStr(cards,li,all,pl,m,tn){
  const M=MODES[m],forms=detectFormations(cards,li,all,pl,m);
  let total=0;
  for(const c of cards){
    let s=c.value;
    if(c.type==='shardbearers')s=c.value*2;
    if(c.type==='spearmen')s+=cards.filter(x=>x.id!==c.id&&x.type==='spearmen').length;
    s-=calcFatigue(c,tn,forms);
    if(s<1)s=1;
    total+=s;
  }
  // Archer range support
  for(let d=1;d<=M.ar;d++)for(const o of[-d,d]){const a=li+o;if(a>=0&&a<M.lanes)for(const c of all[a][pl])if(c.type==='archers')total+=2}
  // Formation bonuses
  for(const f of forms)total+=f.b;
  return total;
}

function canShard(lane,pl){return!lane[pl].some(c=>c.type==='shardbearers')}
function canPlay(card,lanes,pl){if(card.type!=='shardbearers')return true;return lanes.some(l=>canShard(l,pl))}
function playable(hand,lanes,pl){return hand.filter(c=>canPlay(c,lanes,pl)).length}

// ── Resolution ──
function resolve(s){
  const M=MODES[s.mode],res=[];
  for(let i=0;i<M.lanes;i++){
    const h=calcStr(s.lanes[i].human,i,s.lanes,'human',s.mode,turnNum);
    const a=calcStr(s.lanes[i].ai,i,s.lanes,'ai',s.mode,turnNum);
    const hc=s.lanes[i].human.length,ac=s.lanes[i].ai.length;
    let w=null;
    if(h>a)w='human';else if(a>h)w='ai';else if(hc<ac&&hc>0)w='human';else if(ac<hc&&ac>0)w='ai';
    res.push({hs:h,as:a,w,margin:Math.abs(h-a),hc,ac});
  }
  const hl=res.filter(r=>r.w==='human').length,al=res.filter(r=>r.w==='ai').length;
  let rw=null;if(hl>=M.w)rw='human';else if(al>=M.w)rw='ai';
  // Breakthrough check
  let bt=null;
  if(M.tower){
    const ci=M.towerIdx,cr=res[ci];
    if(cr.w&&cr.margin>=10){
      const flankWins=res.filter((r,i)=>i!==ci&&r.w===cr.w).length;
      if(flankWins>=1)bt=cr.w;
    }
  }
  return{lr:res,rw,hl,al,bt};
}

function elim(s){const M=MODES[s.mode];for(let i=0;i<M.lanes;i++){s.lanes[i].human=[];s.lanes[i].ai=[]}}
function drawC(s,n){for(const pl of['human','ai'])for(let i=0;i<n&&s.dp.length>0;i++)s.p[pl].h.push(s.dp.pop())}

// ═══════════════════════════════════════
// AI v3 — Personality-Driven
// ═══════════════════════════════════════
function aiTurn(s){
  const h=s.p.ai.h,M=MODES[s.mode],W=AIW[aiPers];
  if(h.length===0)return{a:'pass'};
  const ev=eLanes(s,'ai'),aw=ev.filter(e=>e.d>0).length,al=ev.filter(e=>e.d<0).length,hh=s.p.human.h.length;

  // Pass logic
  if(s.hp&&aw>=M.w)return{a:'pass'};
  if(aw>=M.w&&s.cr<3){
    const mins=ev.filter(e=>e.d>0).map(e=>e.d);
    if(Math.min(...mins)>=4||(Math.min(...mins)>=2&&h.length>hh+2))return{a:'pass'};
  }
  // Concede logic (personality-weighted)
  if(s.cr<3&&al>=M.w){
    const ts=ev.reduce((a,e)=>a+e.hs,0),ta=ev.reduce((a,e)=>a+e.as,0);
    if(ts-ta>12&&h.length>3&&Math.random()>W.ct)return{a:'concede'};
  }
  if(s.hp&&al>=M.w&&s.cr<3&&h.length>3&&Math.random()>W.ct)return{a:'concede'};

  // Move check: can we improve by moving a deployed card?
  const movePlay=evalMoves(s,ev,W);

  // Deploy evaluation
  let best=null,bs=-Infinity;
  for(const c of h)for(let li=0;li<M.lanes;li++){
    if(c.type==='shardbearers'&&!canShard(s.lanes[li],'ai'))continue;
    const sc=evalPlay(s,c,li,ev,h,W);
    if(sc>bs){bs=sc;best={a:'deploy',c,li}}
  }

  // Compare move vs deploy
  if(movePlay&&movePlay.score>bs+3)return movePlay;

  // Tempo pass
  if(aw>=M.w&&!s.hp&&bs<6)return{a:'pass'};
  if(!best||bs<-8)return{a:'pass'};
  return best;
}

function evalPlay(s,card,li,ev,hand,W){
  const M=MODES[s.mode],e=ev[li];let sc=0;
  let add=card.value;
  if(card.type==='shardbearers')add=card.value*2;
  if(card.type==='spearmen'){const ex=s.lanes[li].ai.filter(c=>c.type==='spearmen').length;add=card.value+ex+ex;}

  // Lane flip
  if(e.d<0&&e.d+add>0)sc+=25;else if(e.d<0&&e.d+add>=0)sc+=18;
  else if(e.d>=0&&e.d<4)sc+=12;else if(e.d>=6)sc-=10;

  // Stacking penalty
  if(s.lanes[li].ai.length>=4)sc-=10;if(s.lanes[li].ai.length>=3)sc-=4;
  if(e.hc>0&&e.ac===0)sc+=10;

  // Formation synergy
  const simCards=[...s.lanes[li].ai,card];
  const simAll=s.lanes.map((l,i)=>({human:[...l.human],ai:i===li?simCards:[...l.ai]}));
  const forms=detectFormations(simCards,li,simAll,'ai',s.mode);
  sc+=forms.reduce((a,f)=>a+f.b,0)*(W.fb/10);

  // Personality: center vs flank
  const isCenter=li===M.towerIdx;
  sc+=isCenter?W.cp:W.fp;

  // Tower breakthrough potential
  if(M.tower&&isCenter&&e.d+add>=10)sc+=15;

  // Archer positioning
  if(card.type==='archers'){
    let adj=Math.min(li,M.ar)+Math.min(M.lanes-1-li,M.ar);sc+=adj*2;
    for(let d=1;d<=M.ar;d++)for(const o of[-d,d]){const a=li+o;if(a>=0&&a<M.lanes&&ev[a].d<0&&ev[a].d>-5)sc+=5}
  }
  if(card.type==='spearmen'){sc+=s.lanes[li].ai.filter(c=>c.type==='spearmen').length*3*W.fb/10}

  sc+=add*0.3;
  if(s.cr===1&&card.value>=8)sc-=4;
  if(s.cr===1&&card.value>=9)sc-=3;

  // Flatface: distribute
  if(M.fd)sc-=s.lanes[li].ai.length*4;

  return sc;
}

function evalMoves(s,ev,W){
  const M=MODES[s.mode];let best=null,bs=-Infinity;
  for(let li=0;li<M.lanes;li++){
    for(const card of s.lanes[li].ai){
      for(const adj of[li-1,li+1]){
        if(adj<0||adj>=M.lanes)continue;
        if(card.type==='shardbearers'&&!canShard(s.lanes[adj],'ai'))continue;
        // Simulate move
        const curDiff=ev[li].d,adjDiff=ev[adj].d;
        const cardStr=card.type==='shardbearers'?card.value*2:card.value;
        const newCur=curDiff-cardStr,newAdj=adjDiff+cardStr-1;
        // Only worth it if it flips the adjacent lane without losing current
        if(newAdj>0&&curDiff>cardStr+2){
          const sc=20+(newAdj-adjDiff);
          if(sc>bs){bs=sc;best={a:'move',card,from:li,to:adj,score:sc}}
        }
      }
    }
  }
  return best;
}

function eLanes(s,pl){
  const oth=pl==='ai'?'human':'ai',M=MODES[s.mode];
  return s.lanes.map((l,i)=>{
    const ps=calcStr(l[pl],i,s.lanes,pl,s.mode,turnNum),os=calcStr(l[oth],i,s.lanes,oth,s.mode,turnNum);
    return{i,as:pl==='ai'?ps:os,hs:pl==='ai'?os:ps,d:ps-os,ac:l.ai.length,hc:l.human.length}
  });
}

function aiCharge(s){
  const M=MODES[s.mode],ev=eLanes(s,'ai');
  let wk=-1,wd=Infinity,st=-1,sd=-Infinity;
  for(let i=0;i<M.lanes;i++){if(ev[i].d<wd&&s.lanes[i].human.length>0){wd=ev[i].d;wk=i}}
  for(let i=0;i<M.lanes;i++){if(i===wk)continue;if(ev[i].d>sd&&s.lanes[i].ai.length>1){sd=ev[i].d;st=i}}
  if(st>=0&&wk>=0&&sd>3){
    const cards=[...s.lanes[st].ai].sort((a,b)=>a.value-b.value);
    const mc=cards[0];
    if(mc&&(mc.type!=='shardbearers'||canShard(s.lanes[wk],'ai'))){
      s.lanes[st].ai=s.lanes[st].ai.filter(c=>c.id!==mc.id);s.lanes[wk].ai.push(mc);
      lg(`Cavalry charge! ${AIW[aiPers].name} repositions to ${MODES[s.mode].ln[wk]}`,'ai');
    }
  }
}

// ═══════════════════════════════════════
// Advisor
// ═══════════════════════════════════════
function advHTML(s){
  if(!s||s.phase!=='play')return'';
  const M=MODES[s.mode],h=s.p.human.h,ev=eLanes(s,'human');
  let o='';
  // Lane status
  o+=`<div class="adv-sec"><h4>Lane Status</h4><div class="la">${ev.map((e,i)=>{
    const cl=e.d>0?'win':e.d<0?'lose':(s.lanes[i].human.length===0&&s.lanes[i].ai.length===0)?'mt':'tied';
    const lb=M.ln[i].replace('Flank','Fl').replace('Center','Ctr').replace('Far ','F.');
    return`<div class="lc ${cl}">${lb}<br>${e.d>0?'+':''}${e.d}</div>`}).join('')}</div></div>`;

  o+='<div class="adv-sec"><h4>Advisor</h4>';

  // Active formations
  const myForms=[];
  for(let i=0;i<M.lanes;i++){const f=detectFormations(s.lanes[i].human,i,s.lanes,'human',s.mode);if(f.length)myForms.push(...f.map(x=>({...x,lane:M.ln[i]})))}
  if(myForms.length)o+=`<div class="tip i"><span class="tl">Active Formations</span>${myForms.map(f=>`${f.ico} <b>${f.n}</b> in ${f.lane} (${f.d})`).join('<br>')}</div>`;

  // Blocked cards
  const blk=h.filter(c=>!canPlay(c,s.lanes,'human'));
  if(blk.length)o+=`<div class="tip w"><span class="tl">Blocked Cards</span>${blk.map(c=>`${UI[c.type]} ${c.type}(${c.value})`).join(', ')} — all lanes have a Shardbearer. Retreat one first.</div>`;
  if(h.length>0&&playable(h,s.lanes,'human')===0)o+=`<div class="tip w"><span class="tl">No Playable Cards</span>Pass, Retreat a Shardbearer, or Concede.</div>`;

  // Tower status
  if(M.tower){
    const ci=M.towerIdx,ce=ev[ci];
    if(ce.d>=8)o+=`<div class="tip" style="border-color:rgba(255,215,0,.3)"><span class="tl g">Tower Breakthrough Close!</span>You're +${ce.d} in Center. Reach +10 with a flank win for instant match victory.</div>`;
    else if(ce.d<=-8)o+=`<div class="tip w"><span class="tl">Tower Threat</span>Sadeas is +${Math.abs(ce.d)} in Center. A breakthrough could end the match.</div>`;
  }

  // Strategic advice
  const win=ev.filter(e=>e.d>0).length,lose=ev.filter(e=>e.d<0).length;
  if(win>=M.w){const m=Math.min(...ev.filter(e=>e.d>0).map(e=>e.d));
    o+=m>=4?`<div class="tip i"><span class="tl">Strong Position</span>Pass to conserve cards.</div>`
      :`<div class="tip i"><span class="tl">Ahead but Thin</span>Margins are tight — one card could flip a lane.</div>`}
  if(lose>=M.w&&s.cr<3)o+=`<div class="tip w"><span class="tl">Consider Conceding</span>Save ${h.length} cards for rounds ${s.cr+1}–3.</div>`;

  // Card advantage
  const ah=s.p.ai.h.length;
  if(h.length<ah-2)o+=`<div class="tip w"><span class="tl">Card Disadvantage</span>${AIW[aiPers].name} has ${ah-h.length} more cards.</div>`;

  // Move suggestion
  const movable=[];
  for(let i=0;i<M.lanes;i++)for(const c of s.lanes[i].human){for(const adj of[i-1,i+1])if(adj>=0&&adj<M.lanes){const e=ev[adj];if(e.d<0)movable.push({card:c,from:M.ln[i],to:M.ln[adj],gap:e.d})}}
  if(movable.length>0&&!s.sel){const best=movable.sort((a,b)=>a.gap-b.gap)[0];
    o+=`<div class="tip"><span class="tl g">Move Option</span>Consider moving ${UI[best.card.type]} from ${best.from} to ${best.to} (${best.gap} deficit there). Costs −1 strength.</div>`}

  // Selected card
  if(s.sel)o+=`<div class="tip"><span class="tl g">${UI[s.sel.type]} ${s.sel.type} (${s.sel.value})</span>${cardAdv(s.sel,s)}</div>`;

  o+='</div>';
  // Quick ref
  o+=`<div class="adv-sec"><h4>Formations</h4><div class="tip" style="font-size:10px">
    <b>Phalanx:</b> 3+ Spearmen → +3/each<br>
    <b>Skirmish:</b> Archer+Cavalry → +3/ar +2/cv<br>
    <b>Shardwall:</b> Shard+2 Spear → no fatigue<br>
    <b>Vanguard:</b> Solo Cavalry → +4/each<br>
    <b>Crossfire:</b> Archers adj lanes → +2/each
  </div></div>`;
  return o;
}

function cardAdv(c,s){
  const M=MODES[s.mode];
  if(c.type==='spearmen'){let bl=-1,bb=0;for(let i=0;i<M.lanes;i++){const n=s.lanes[i].human.filter(x=>x.type==='spearmen').length;if(n>bb){bb=n;bl=i}}
    return bb>=2?`Phalanx ready in ${M.ln[bl]} (${bb} spearmen). Deploying here triggers +3/each!`:'Start a formation cluster in a contested lane.'}
  if(c.type==='archers')return`Place in center-ish lane for max adjacency range${M.ar>1?' (2 lanes each way)':''}.`;
  if(c.type==='cavalry')return'Triggers Charge (reposition 1 card). Alone in a lane = Vanguard (+4).';
  if(c.type==='shardbearers'){const b=[];for(let i=0;i<M.lanes;i++)if(!canShard(s.lanes[i],'human'))b.push(M.ln[i]);
    return b.length===M.lanes?'<b style="color:var(--red)">BLOCKED</b> — retreat a Shardbearer first.':`Worth ${c.value*2}. Pair with 2 Spearmen for Shardwall.${b.length?` Blocked in: ${b.join(', ')}.`:''}`}
  return'';
}

function rHC(c,s){
  const sel=s.sel&&s.sel.id===c.id,pl=canPlay(c,s.lanes,'human');
  const eff=c.type==='shardbearers'?c.value*2:c.value;
  return`<div class="cd ${c.type} ${sel?'sel':''} ${!pl?'unp':''}" data-id="${c.id}" data-hand="1" title="${pl?TYPE_LABEL[c.type]+' — Str '+eff:'Blocked — all lanes have Shardbearer'}"><span class="cd-suit">${SUIT_SYM[c.type]}</span><span class="ci">${UNIT_SVG[c.type]}</span><span class="cv">${c.value}</span><span class="ct">${TYPE_LABEL[c.type]}</span>${c.type==='shardbearers'?'<span class="cs">×2</span>':''}<span class="cd-eff">${eff}</span></div>`;
}
function rHC_pvp(c,s,side){
  const sel=s.sel&&s.sel.id===c.id,pl=canPlay(c,s.lanes,side);
  const eff=c.type==='shardbearers'?c.value*2:c.value;
  return`<div class="cd ${c.type} ${sel?'sel':''} ${!pl?'unp':''}" data-id="${c.id}" data-hand="1" data-pvp="${side}" title="${TYPE_LABEL[c.type]+' — Str '+eff}"><span class="cd-suit">${SUIT_SYM[c.type]}</span><span class="ci">${UNIT_SVG[c.type]}</span><span class="cv">${c.value}</span><span class="ct">${TYPE_LABEL[c.type]}</span>${c.type==='shardbearers'?'<span class="cs">×2</span>':''}<span class="cd-eff">${eff}</span></div>`;
}

function rCard(c,fd=false){
  const fat=c.type==='shardbearers'&&c.deployTurn>=0?Math.floor((turnNum-c.deployTurn)/3):0;
  const mf=c.moved?1:0;const tf=fat+mf;
  let eff=c.type==='shardbearers'?c.value*2:c.value;
  if(c.type==='spearmen')eff=c.value;
  eff=Math.max(1,eff-tf);
  if(fd)return`<div class="cd face-down" data-id="${c.id}"><span class="ci">${UNIT_SVG[c.type]}</span><span class="cv">${c.value}</span><span class="ct">${TYPE_LABEL[c.type]||''}</span><div class="card-back">${UNIT_SVG.facedown}</div></div>`;
  return`<div class="cd ${c.type}" data-id="${c.id}"><span class="cd-suit">${SUIT_SYM[c.type]||''}</span><span class="ci">${UNIT_SVG[c.type]||''}</span><span class="cv">${c.value}</span><span class="ct">${TYPE_LABEL[c.type]||''}</span>${c.type==='shardbearers'?'<span class="cs">×2</span>':''}${tf>0?`<span class="fat-ind">-${tf}</span>`:''}<span class="cd-eff">${eff}</span></div>`;
}

function rLane(l,i,s){
  const M=MODES[s.mode],ff=M.fd,isRes=s.phase==='round_end'||s.phase==='match_end';
  const show=!ff||isRes;
  const h=calcStr(l.human,i,s.lanes,'human',s.mode,turnNum),a=show?calcStr(l.ai,i,s.lanes,'ai',s.mode,turnNum):'?';
  const activeSide=pvpMode&&s.turn==='ai'?'ai':'human';
  const rmC=s.rm?'rm':'',mmC=s.mm?'mm':'';
  const isTower=M.tower&&i===M.towerIdx;
  // Human formations
  const hf=detectFormations(l.human,i,s.lanes,'human',s.mode);
  const af=show?detectFormations(l.ai,i,s.lanes,'ai',s.mode):[];
  // Click-to-deploy + preview
  const sel=s.sel;const isDeploying=sel&&!s.rm&&!s.mm&&!s.cm&&s.phase==='play';
  let deployClass='',previewHTML='';
  if(isDeploying){
    const prev=calcPreview(sel,i,s);
    if(prev&&!prev.blocked){
      deployClass='deploy-target';
      let formTxt=prev.newForms.length?prev.newForms.map(f=>`${f.ico}${f.n}`).join(' '):'';
      previewHTML=`<div class="lane-preview"><span class="preview-add">+${prev.diff}</span>${formTxt?`<span class="preview-form">${formTxt}</span>`:''}${prev.adjBonus?`<span class="preview-form">+${prev.adjBonus} to adj</span>`:''}</div>`;
    } else if(prev&&prev.blocked){
      deployClass='deploy-target blocked';
      previewHTML=`<div class="lane-preview"><span class="preview-blocked">Shardbearer limit</span></div>`;
    }
  }

  return`<div class="ln ${isTower?'tower-lane':''} ${deployClass}" data-lane="${i}" ${deployClass==='deploy-target'?`onclick="dep(${i})"`:''}>
    <div class="lh">${M.ln[i]}${isTower?'<span class="tower-icon"> 🏰</span>':''}</div>
    <div class="ls as ${activeSide==='ai'?rmC+' '+mmC:''}" data-lane="${i}" data-side="ai">${l.ai.map(c=>rCard(c,ff&&!isRes)).join('')}</div>
    <div class="fm-row">${af.map(f=>`<span class="fm-badge">${f.ico} ${f.n}</span>`).join('')}</div>
    <div class="lt"><span class="at">${a}</span><span class="vs">vs</span><span class="ht">${h}</span></div>
    ${previewHTML}
    <div class="fm-row">${hf.map(f=>`<span class="fm-badge">${f.ico} ${f.n}</span>`).join('')}</div>
    <div class="ls hs ${activeSide==='human'?rmC+' '+mmC:''}" data-lane="${i}" data-side="human">${l.human.map(c=>rCard(c,false)).join('')}</div>
  </div>`;
}

function rBlk(s){
  if(s.phase!=='play')return'';
  if(!pvpMode&&s.turn!=='human')return'';
  const side=pvpMode&&s.turn==='ai'?'ai':'human';
  const h=s.p[side].h;if(h.length===0||playable(h,s.lanes,side)>0)return'';
  return`<div class="blk">⚠️ No cards can deploy — every lane has a Shardbearer. Retreat one, Pass, or Concede.</div>`;
}

function rAct(s){
  const M=MODES[s.mode],side=pvpMode&&s.turn==='ai'?'ai':'human';
  const h=s.p[side].h,pc=playable(h,s.lanes,side);
  const td=s.lanes.reduce((a,l)=>a+l[side].length,0);

  if(s.sel&&!s.rm&&!s.mm&&!s.cm){
    const c=s.sel;if(!canPlay(c,s.lanes,side))return`<div class="blk">🗡️ This Shardbearer can't deploy — every lane has one. Retreat first.</div><div class="act"><button class="btn" onclick="cSel()">Cancel</button></div>`;
    return`<div class="lsb">${M.ln.map((n,i)=>{const dis=c.type==='shardbearers'&&!canShard(s.lanes[i],side);return`<button class="btn p" onclick="dep(${i})" ${dis?'disabled title="Has Shardbearer"':''}>${n}</button>`}).join('')}</div><div class="act"><button class="btn" onclick="cSel()">Cancel</button></div>`;
  }
  if(s.cm)return`<div class="act"><button class="btn" onclick="cCharge()">Skip Charge</button></div>`;
  if(s.rm)return`<div class="act"><button class="btn" onclick="cRet()">Cancel Retreat</button></div>`;
  if(s.mm)return`<div class="act"><button class="btn" onclick="cMove()">Cancel Move</button></div>`;

  // Smart action hints
  const ev=s.phase==='play'?eLanes(s,'human'):[];
  const winning=ev.filter(e=>e.d>0).length;
  const losing=ev.filter(e=>e.d<0).length;
  const M2=MODES[s.mode];
  const shouldPulsePass=winning>=M2.w&&ev.filter(e=>e.d>0).every(e=>e.d>=3);
  const shouldPulseConcede=losing>=M2.w&&s.cr<3&&h.length>3;

  return`<div class="act">
    <button class="btn p" onclick="sDep()" ${pc===0?'disabled':''}>Deploy</button>
    <button class="btn" onclick="sMove()" ${td===0?'disabled':''}>Move</button>
    <button class="btn" onclick="sRet()" ${td===0?'disabled':''}>Retreat</button>
    <button class="btn g ${shouldPulsePass?'pulse-pass':''}" onclick="pPass()">Pass${shouldPulsePass?' ✓':''}</button>
    <button class="btn d ${shouldPulseConcede?'pulse-concede':''}" onclick="pCon()">Concede 🤝</button>
  </div>`;
}

function rOv(s){
  const M=MODES[s.mode];
  if(s.phase==='match_end'){
    const w=s.p.human.rw>=2?'human':'ai',isW=w==='human';
    const lastR=s.rr[s.rr.length-1];
    const bt=lastR&&lastR.bt;
    // Track beaten opponents for unlocks
    if(isW&&!pvpMode&&!beatenOpponents.includes(aiPers))beatenOpponents.push(aiPers);
    if(isW)setTimeout(sndRoundWin,100); else setTimeout(sndRoundLose,100);
    if(bt)setTimeout(()=>{triggerScreenShake();spawnParticles()},200);
    const unlockMsg=isW&&beatenOpponents.length>=1&&beatenOpponents.length<=3?
      `<p style="color:var(--gld);font-size:12px">🔓 New opponent unlocked!</p>`:'';
    return`<div class="ovc"><div style="font-size:44px;margin-bottom:6px">🤝</div><h2>${isW?'Victory!':'Defeat'}</h2>
      ${bt?`<div class="bt-alert">🏰 BREAKTHROUGH! The Tower has fallen!</div>`:''}
      <p>${isW?'"The Codes are upheld."':`"${currentSmack||'A worthy contest.'}"  — ${AIW[aiPers].name}`}</p>
      ${unlockMsg}
      <div class="sc"><span class="ps">${s.p.human.rw}</span><span style="color:var(--dim)"> – </span><span class="as">${s.p.ai.rw}</span></div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="btn p" onclick="rematch()">Rematch</button><button class="btn" onclick="toMenu()">Menu</button></div></div>`;
  }
  if(s.phase==='round_end'){
    const last=s.rr[s.rr.length-1];if(!last)return'';
    const isW=last.rw==='human',isD=last.rw===null;
    return`<div class="ovc"><h2>Round ${s.cr-1} ${isD?'Draw':(isW?'Won!':'Lost')}</h2>
      <p>${last.lr.map((r,i)=>`${M.ln[i]}${M.tower&&i===M.towerIdx?' 🏰':''}: ${r.hs} vs ${r.as} ${r.w==='human'?'✓':r.w==='ai'?'✗':'—'}${r.margin>=10&&r.w?' ⚡':''}`).join('<br>')}</p>
      <p style="color:var(--gld)">Lanes: You ${last.hl} – ${last.al} AI</p>
      <p style="font-size:11px;color:var(--dim)">Cards eliminated. Drawing ${Math.min(M.draw,G.dp.length)} each.</p>
      <button class="btn p" onclick="nextRd()">Round ${s.cr}</button></div>`;
  }
  return'';
}

function stTxt(s){
  const M=MODES[s.mode];
  if(s.phase!=='play')return'';
  if(!pvpMode&&s.turn==='ai')return`${AIW[aiPers].icon} ${AIW[aiPers].name} is thinking...`;
  const whoLabel=pvpMode?(s.turn==='human'?'🔵 Player 1':'🟢 Player 2'):'🔵 You';
  if(s.rm)return`${whoLabel} — click a deployed card to retreat`;
  if(s.mm)return`${whoLabel} — click a deployed card to move (−1 strength)`;
  if(s.cm)return`${whoLabel} — Cavalry Charge: click a card to reposition`;
  if(s.sel)return`${whoLabel} — ${UI[s.sel.type]} ${s.sel.type} (${s.sel.value}) selected — click a lane to deploy`;
  return`${whoLabel} — Deploy, Move, Retreat, Pass, or Concede`;
}
function hintTxt(s){
  if(!s.sel)return'Select a card to see its ability';
  const c=s.sel,M=MODES[s.mode];
  if(c.type==='spearmen')return`⚔️ Formation +1/Spearman. 3+ = Phalanx (+3 each)`;
  if(c.type==='archers')return`🏹 +2 to adj lanes${M.ar>1?' (2 away)':''}. +Cavalry = Skirmish Line`;
  if(c.type==='cavalry')return`🐴 Charge: reposition 1 card. Solo = Vanguard (+4)`;
  if(c.type==='shardbearers')return`🗡️ ×2 str (=${c.value*2}). Fatigues over time. +2 Spear = Shardwall`;
  return'';
}

// ═══════════════════════════════════════
// Events
// ═══════════════════════════════════════
function bindMenu(){
  document.querySelectorAll('.ai-card').forEach(el=>el.addEventListener('click',()=>{
    if(el.dataset.ai==='pvp'){pvpMode=true;aiPers='sadeas'}else{pvpMode=false;aiPers=el.dataset.ai}
    R();
  }));
  document.querySelectorAll('.mc').forEach(el=>el.addEventListener('click',()=>{mode=el.dataset.mode;startGame(mode)}));
}

function bind(){
  // Hand card clicks — works for both P1 and PvP P2
  document.querySelectorAll('.hd .cd').forEach(el=>el.addEventListener('click',()=>{
    if(anim)return;
    const isP2=pvpMode&&G.turn==='ai';
    if(!pvpMode&&G.turn!=='human')return;
    const hand=isP2?G.p.ai.h:G.p.human.h;
    const c=hand.find(x=>x.id===el.dataset.id);if(!c)return;
    G.sel=G.sel?.id===c.id?null:c;G.rm=false;G.mm=false;G.cm=false;G.cid=null;sndSelect();R();
  }));
  // Lane card clicks — for retreat/move/charge, use the active player's side
  const side=pvpMode&&G.turn==='ai'?'ai':'human';
  document.querySelectorAll(`.ls[data-side="${side}"] .cd`).forEach(el=>el.addEventListener('click',()=>{
    if(anim)return;const id=el.dataset.id;
    if(G.rm)retCard(id);
    else if(G.mm)moveCard(id);
    else if(G.cm&&!G.cid)selCharge(id);
  }));
}

// Actions
window.sDep=()=>{G.rm=false;G.mm=false;G.cm=false;R()};
window.sRet=()=>{G.rm=true;G.sel=null;G.mm=false;G.cm=false;R()};
window.sMove=()=>{G.mm=true;G.sel=null;G.rm=false;G.cm=false;R()};
window.cSel=()=>{G.sel=null;R()};
window.cRet=()=>{G.rm=false;R()};
window.cMove=()=>{G.mm=false;R()};
window.cCharge=()=>{G.cm=false;G.cid=null;lg('You skip the charge.','player');endTurn()};

window.dep=function(li){
  const c=G.sel;if(!c)return;
  const side=pvpMode&&G.turn==='ai'?'ai':'human';
  if(c.type==='shardbearers'&&!canShard(G.lanes[li],side))return;
  G.p[side].h=G.p[side].h.filter(x=>x.id!==c.id);
  c.deployTurn=turnNum;c.moved=false;
  G.lanes[li][side].push(c);G.sel=null;
  if(side==='human')G.hp=false; else G.ap=false;
  const who=side==='human'?'Player 1':'Player 2';
  lg(`${pvpMode?who:'You'} deploy${pvpMode?'s':''} ${UI[c.type]} ${c.type} (${c.value}) to ${MODES[G.mode].ln[li]}`,side==='human'?'player':'ai');
  sndDeploy();
  // Check if a new formation triggered for sound
  const postForms=detectFormations(G.lanes[li][side],li,G.lanes,side,G.mode);
  if(postForms.length>0)setTimeout(sndFormation,200);
  const td=G.lanes.reduce((a,l)=>a+l[side].length,0);
  if(c.type==='cavalry'&&td>1){G.cm=true;G.cid=null;R();return}
  endTurn();
};

function moveCard(id){
  const M=MODES[G.mode],side=pvpMode&&G.turn==='ai'?'ai':'human';
  for(let i=0;i<M.lanes;i++){
    const c=G.lanes[i][side].find(x=>x.id===id);
    if(c){
      // Show adjacent lane options
      G.mm=false;
      const st=document.getElementById('st');
      if(st)st.textContent=`Move ${UI[c.type]} (${c.value}) to which lane?`;
      const actDiv=document.querySelector('.act');
      if(actDiv){
        actDiv.innerHTML=M.ln.map((n,li)=>{
          if(li===i)return`<button class="btn sm" disabled>${n} (here)</button>`;
          if(Math.abs(li-i)>1)return`<button class="btn sm" disabled>${n} (too far)</button>`;
          const dis=c.type==='shardbearers'&&!canShard(G.lanes[li],'human');
          return`<button class="btn sm p" onclick="execMove('${id}',${i},${li})" ${dis?'disabled':''}>${n}</button>`;
        }).join('')+`<button class="btn sm" onclick="cMove2()">Cancel</button>`;
      }
      return;
    }
  }
}
window.cMove2=()=>{G.mm=false;R()};
window.execMove=function(id,from,to){
  const side=pvpMode&&G.turn==='ai'?'ai':'human';
  const c=G.lanes[from][side].find(x=>x.id===id);if(!c)return;
  if(c.type==='shardbearers'&&!canShard(G.lanes[to],side)){lg('Blocked — lane has Shardbearer.','system');R();return}
  G.lanes[from][side]=G.lanes[from][side].filter(x=>x.id!==id);c.moved=true;G.lanes[to][side].push(c);
  if(side==='human')G.hp=false;else G.ap=false;
  lg(`${pvpMode?(side==='human'?'P1':'P2'):'You'} move${pvpMode?'s':''} ${UI[c.type]} to ${MODES[G.mode].ln[to]} (−1)`,'player');endTurn();
};

function retCard(id){
  const M=MODES[G.mode],side=pvpMode&&G.turn==='ai'?'ai':'human';
  for(let i=0;i<M.lanes;i++){const idx=G.lanes[i][side].findIndex(c=>c.id===id);
    if(idx!==-1){const c=G.lanes[i][side].splice(idx,1)[0];c.deployTurn=-1;c.moved=false;G.p[side].h.push(c);G.rm=false;
      if(side==='human')G.hp=false;else G.ap=false;
      lg(`${pvpMode?(side==='human'?'P1':'P2'):'You'} retreat${pvpMode?'s':''} ${UI[c.type]} (${c.value}) from ${M.ln[i]}`,side==='human'?'player':'ai');endTurn();return}}
}

function selCharge(id){
  const M=MODES[G.mode],side=pvpMode&&G.turn==='ai'?'ai':'human';
  for(let i=0;i<M.lanes;i++){const c=G.lanes[i][side].find(x=>x.id===id);
    if(c){G.cid=id;const st=document.getElementById('st');if(st)st.textContent=`Move ${UI[c.type]} (${c.value}) to which lane?`;
      const ad=document.querySelector('.act');
      if(ad)ad.innerHTML=M.ln.map((n,li)=>li===i?`<button class="btn sm" disabled>${n}</button>`
        :`<button class="btn sm p" onclick="doCharge('${id}',${i},${li})">${n}</button>`).join('')+`<button class="btn sm" onclick="cCharge()">Skip</button>`;
      return}}
}
window.doCharge=function(id,from,to){
  const side=pvpMode&&G.turn==='ai'?'ai':'human';
  const c=G.lanes[from][side].find(x=>x.id===id);if(!c)return;
  if(c.type==='shardbearers'&&!canShard(G.lanes[to],side)){lg('Blocked.','system');G.cm=false;G.cid=null;endTurn();return}
  G.lanes[from][side]=G.lanes[from][side].filter(x=>x.id!==id);G.lanes[to][side].push(c);
  lg(`Cavalry charge! ${UI[c.type]} repositioned to ${MODES[G.mode].ln[to]}`,'player');G.cm=false;G.cid=null;endTurn();
};

window.pPass=function(){
  const who=G.turn;
  if(who==='human')G.hp=true; else G.ap=true;
  G.sel=null;G.rm=false;G.mm=false;
  lg(`${who==='human'?'Player 1':'Player 2'} passes.`,who==='human'?'player':'ai');
  sndPass();
  if(G.hp&&G.ap)resRound(); else endTurn();
};
window.pCon=function(){
  const who=G.turn;
  if(who==='human'){lg('Player 1 offers a handshake and concedes.','player');G.p.ai.rw++}
  else{lg('Player 2 offers a handshake and concedes.','ai');G.p.human.rw++}
  sndConcede();
  elim(G);chkEnd();
};

// Turn flow
function endTurn(){
  turnNum++;G.sel=null;G.rm=false;G.mm=false;
  if(pvpMode){
    G.turn=G.turn==='human'?'ai':'human';
    handoffScreen=true;
    R();
  } else {
    G.turn='ai';R();
    anim=true;setTimeout(()=>{aiExec();anim=false},600+Math.random()*400);
  }
}
window.dismissHandoff=function(){handoffScreen=false;R();};

function aiExec(){
  const M=MODES[G.mode],d=aiTurn(G);
  if(d.a==='pass'){G.ap=true;lg(`${AIW[aiPers].name} passes.`,'ai');if(Math.random()>.6)triggerSmack('pass');if(G.hp){resRound();return}}
  else if(d.a==='concede'){lg(`${AIW[aiPers].name} concedes.`,'ai');triggerSmack('concede');G.p.human.rw++;elim(G);chkEnd();return}
  else if(d.a==='deploy'){
    const{c,li}=d;G.p.ai.h=G.p.ai.h.filter(x=>x.id!==c.id);c.deployTurn=turnNum;c.moved=false;G.lanes[li].ai.push(c);G.ap=false;
    lg(`${AIW[aiPers].name} deploys ${M.fd?'a card':UI[c.type]+' '+c.type+' ('+c.value+')'} to ${M.ln[li]}`,'ai');
    sndDeploy();
    if(c.type==='cavalry')aiCharge(G);
    if(c.type==='shardbearers'||c.value>=8)triggerSmack('deploy_strong');
    else if(Math.random()>.65)triggerSmack('deploy');
  }
  else if(d.a==='move'){
    const{card,from,to}=d;
    G.lanes[from].ai=G.lanes[from].ai.filter(x=>x.id!==card.id);card.moved=true;G.lanes[to].ai.push(card);G.ap=false;
    lg(`${AIW[aiPers].name} moves ${M.fd?'a unit':UI[card.type]} to ${M.ln[to]}`,'ai');
  }
  G.turn='human';witProactive();R();
  setTimeout(()=>{const el=document.getElementById('witMsgs');if(el)el.scrollTop=el.scrollHeight},100);
}

function resRound(){
  const r=resolve(G);G.rr.push(r);const M=MODES[G.mode];
  // Apply lane flash classes
  setTimeout(()=>{
    document.querySelectorAll('.ln').forEach((el,i)=>{
      if(i<r.lr.length){
        const cls=r.lr[i].w==='human'?'flash-win':r.lr[i].w==='ai'?'flash-lose':'flash-draw';
        el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1300);
      }
    });
  },50);
  // Breakthrough check
  if(r.bt){
    const winner=r.bt;
    if(winner==='human'){G.p.human.rw=2;lg(`BREAKTHROUGH! You shatter The Tower!`,'system')}
    else{G.p.ai.rw=2;lg(`BREAKTHROUGH! ${AIW[aiPers].name} breaks through The Tower!`,'ai')}
    sndBreakthrough();triggerScreenShake();setTimeout(spawnParticles,200);
  } else {
    if(r.rw==='human'){G.p.human.rw++;lg(`Round ${G.cr}: You win! (${r.hl}–${r.al})`,'system');triggerSmack('loseRound');sndRoundWin()}
    else if(r.rw==='ai'){G.p.ai.rw++;lg(`Round ${G.cr}: ${AIW[aiPers].name} wins. (${r.al}–${r.hl})`,'system');triggerSmack('winRound');sndRoundLose()}
    else{lg(`Round ${G.cr}: Draw!`,'system');sndPass()}
  }
  elim(G);G.cr++;G.hp=false;G.ap=false;turnNum=0;
  if(G.p.human.rw>=2||G.p.ai.rw>=2||G.cr>3)G.phase='match_end';else G.phase='round_end';
  R();
}

function chkEnd(){
  G.cr++;G.hp=false;G.ap=false;turnNum=0;
  G.rr.push({rw:null,lr:[],hl:0,al:0,bt:null});
  if(G.p.human.rw>=2||G.p.ai.rw>=2)G.phase='match_end';
  else if(G.cr>3)G.phase='match_end';
  else G.phase='round_end';
  R();
}

window.nextRd=function(){drawC(G,MODES[G.mode].draw);G.phase='play';G.turn='human';G.sel=null;lg(`— Round ${G.cr} begins. —`,'system');R()};
window.rematch=()=>startGame(mode);
window.toMenu=()=>{menu=true;R()};
window.togAdv=()=>{advOpen=!advOpen;R()};

function startGame(m){
  mode=m;
  // v11: Open deck builder instead of starting directly
  openDeckBuilder();
}

R();
</script>
